services:
  - type: web
    name: codecraft-assistant
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    disk:
      name: codecraft-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: MAX_ACTIVE_OPENCODE_INSTANCES
        value: "2"
      - key: AI_REQUESTS_PER_MINUTE
        value: "15"
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL_ID
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: SUBSCRIPTION_DISPLAY_PRICE
        value: "Manual activation after administrator review"
